<!doctype html>
<html>
  <head>
    <title>SQLgard - RPG Engine</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
        text-align: center;
        justify-content: center;
      }

      h1 {
        margin-bottom: 5px;
      }

      button {
        background-color: #423ce7;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #c0392b;
      }

      table {
        border-collapse: collapse;
        width: 70%;
        margin-top: 20px;
        background-color: #d9d9d9;
      }

      th,
      td {
        border: 1px solid #c0c0c0;
        padding: 10px;
        text-align: left;
        background-color: #eee;
      }

      th {
        background-color: #d0d0d0;
      }

      .caido {
        background-color: #e5bcbc;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div style="">
      <h1>SQLgard - RPG Engine</h1>

      <p>O Despertar do Kernel Ancestral</p>

      <p><i>Uma nevoa venenosa drena a vida de todos os herois...</i></p>
    </div>
    <div
      style="
        flex-direction: columns;
        display: flex;
        gap: 10px;
        justify-content: center;
      "
    >
      <form action="/processar" method="post">
        <button type="submit">Proximo Turno</button>
      </form>
      <form action="/resetar" method="post">
        <button type="submit" style="background-color: red; color: white">
          Resetar Jogo
        </button>
      </form>
    </div>
    <div style="margin-left: auto; margin-right: 0; width: 80%;">
      <table>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Classe</th>
          <th>HP</th>
          <th>Barra HP</th>
          <th>Status</th>
        </tr>

        {% for h in herois %}
        <tr>
          <td>{{h[0]}}</td>
          <td>{{h[1]}}</td>
          <td>{{h[2]}}</td>

          <td>{{h[3]}}/{{h[4]}}</td>

          <td>
            <progress value="{{h[3]}}" max="{{h[4]}}"></progress>
          </td>

          <td class="{% if h[5] == 'CAIDO' %}caido{% endif %}">{{h[5]}}</td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </body>
</html>
